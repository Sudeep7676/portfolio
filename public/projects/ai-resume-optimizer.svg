<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="AI Resume Optimizer landing page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d1326"/>
      <stop offset="0.55" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#070b17"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.82" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="watermark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.005"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>
  <rect width="1600" height="1000" fill="url(#halo2)"/>

  <!-- starfield -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="150" cy="180" r="1.4"/><circle cx="410" cy="120" r="1"/><circle cx="640" cy="210" r="1.2"/>
    <circle cx="880" cy="140" r="1"/><circle cx="1180" cy="250" r="1.4"/><circle cx="1420" cy="170" r="1"/>
    <circle cx="260" cy="420" r="1.1"/><circle cx="520" cy="520" r="1"/><circle cx="1040" cy="470" r="1.3"/>
    <circle cx="1330" cy="560" r="1"/><circle cx="700" cy="700" r="1.2"/><circle cx="960" cy="800" r="1"/>
    <circle cx="180" cy="760" r="1.1"/><circle cx="1480" cy="740" r="1.2"/>
  </g>

  <!-- faint hex outlines -->
  <g stroke="#60a5fa" stroke-opacity="0.12" fill="none" stroke-width="1.4">
    <path d="M190 260 l26 -15 26 15 v30 l-26 15 -26 -15z"/>
    <path d="M1300 380 l22 -13 22 13 v26 l-22 13 -22 -13z"/>
    <circle cx="1330" cy="240" r="16"/>
    <rect x="330" y="600" width="46" height="46" rx="8"/>
  </g>

  <!-- giant RESUME watermark -->
  <text x="800" y="880" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="240" font-weight="900" letter-spacing="14" fill="url(#watermark)">RESUME</text>

  <!-- ===== nav ===== -->
  <g>
    <circle cx="288" cy="30" r="15" fill="#ffffff" opacity="0.92"/>
    <circle cx="288" cy="30" r="9" fill="#1e293b"/>
    <text x="316" y="38" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">NextGen</text>
    <text x="420" y="38" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="url(#brand)">Labs</text>

    <text x="1135" y="37" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" fill="#cbd5e1">Contact Us</text>
    <rect x="1232" y="13" width="130" height="36" rx="18" fill="url(#cta)"/>
    <text x="1297" y="37" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Build Resume</text>
  </g>

  <!-- corner telemetry -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#64748b" letter-spacing="1.5">
    <text x="26" y="98">SYS.ONLINE</text>
    <text x="26" y="118">BUILD.2026</text>
    <rect x="26" y="130" width="46" height="2" fill="#3b82f6" opacity="0.6"/>
    <text x="1574" y="98" text-anchor="end">SECT.GEN</text>
    <text x="1574" y="118" text-anchor="end">AI.ENGINE</text>
    <rect x="1528" y="130" width="46" height="2" fill="#a855f7" opacity="0.6"/>
  </g>

  <!-- ===== badge ===== -->
  <g>
    <rect x="683" y="176" width="234" height="36" rx="18" fill="#1e293b" fill-opacity="0.75" stroke="#3b82f6" stroke-opacity="0.45"/>
    <circle cx="707" cy="194" r="4" fill="#60a5fa"/>
    <text x="722" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="1.6" fill="#93c5fd">AI-POWERED RESUME ENGINE</text>
  </g>

  <!-- ===== headline ===== -->
  <g text-anchor="middle" font-family="Inter, Arial Black, Arial, Helvetica, sans-serif" font-weight="900">
    <text x="800" y="320" font-size="96" fill="#ffffff" letter-spacing="-3">Build a</text>
    <text x="800" y="418" font-size="96" fill="url(#accent)" font-style="italic" letter-spacing="-3">Recruiter-Ready</text>
    <text x="800" y="516" font-size="96" fill="#ffffff" letter-spacing="-3">Resume.</text>
  </g>

  <text x="800" y="580" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" fill="#94a3b8">
    Structured AI prompts · <tspan fill="#e2e8f0">Professional LaTeX workflow</tspan> · ATS-optimized output
  </text>

  <!-- ===== CTAs ===== -->
  <g>
    <rect x="548" y="632" width="290" height="60" rx="14" fill="url(#cta)"/>
    <text x="693" y="669" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="17" font-weight="700" fill="#ffffff">Generate Resume Portal  →</text>

    <rect x="858" y="632" width="256" height="60" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="986" y="669" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="17" font-weight="600" fill="#e2e8f0">View Resume Templates</text>
  </g>

  <!-- ===== stats ===== -->
  <g text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="648" y="790" font-size="42" font-weight="800" fill="#ffffff">10K+</text>
    <text x="648" y="818" font-size="12" letter-spacing="1.8" fill="#64748b">RESUMES BUILT</text>

    <text x="800" y="790" font-size="42" font-weight="800" fill="#ffffff">95%</text>
    <text x="800" y="818" font-size="12" letter-spacing="1.8" fill="#64748b">ATS PASS RATE</text>

    <text x="952" y="790" font-size="42" font-weight="800" fill="#ffffff">4.9★</text>
    <text x="952" y="818" font-size="12" letter-spacing="1.8" fill="#64748b">USER RATING</text>
  </g>

  <!-- side rails -->
  <line x1="256" y1="62" x2="256" y2="1000" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="1344" y1="62" x2="1344" y2="1000" stroke="#ffffff" stroke-opacity="0.05"/>
</svg>
